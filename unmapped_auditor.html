    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #111; color: #eee; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .track { background: #222; border: 1px solid #444; border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .track:hover { background: #333; border-color: #666; }
        .track.playing { background: #4a4; color: #000; font-weight: bold; border-color: #6f6; }
        .track.played { opacity: 0.5; }
        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }
        audio { display: none; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>

        sounds.forEach((sound, index) => {

            div.className = 'track';
            div.textContent = sound;
            div.onclick = () => playSound(sound, div, index);
            grid.appendChild(div);
        });

        autoBtn.onclick = () => {
            isAuto = !isAuto;
            autoBtn.textContent = 'Auto-play Next: ' + (isAuto ? 'ON' : 'OFF');
            autoBtn.style.background = isAuto ? '#28a745' : '#007bff';
        };

        stopBtn.onclick = () => {
            player.pause();
            if (currentTrack) currentTrack.classList.remove('playing');
        };

        function playSound(file, el, index) {
            if (currentTrack) currentTrack.classList.remove('playing');
            el.classList.add('playing');
            el.classList.add('played');
            currentTrack = el;
            player.src = 'extracted_audio/' + file;
            player.play();
            player.onended = () => {
                el.classList.remove('playing');
                if (isAuto && index + 1 < sounds.length) {
                    const nextEl = grid.children[index + 1];
                    playSound(sounds[index + 1], nextEl, index + 1);
                }
            };
        }
